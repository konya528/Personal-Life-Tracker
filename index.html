'use strict';const KEY='habit-log-v1';const colors=['#edbe86','#80c3e6','#a5d59c','#e8a7d0','#bbc0c8','#afa5df'];const uid=()=>crypto.randomUUID?.()||'id'+Date.now()+Math.random();const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>localDate(new Date());const shiftDate=(s,offset)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+offset);return localDate(d)};const seed=[['朝の歯磨き','habit','check',0],['ストレッチ','habit','check',1],['タンパク質','habit','check',2],['体調','habit','state',3],['自室の掃除','routine','check',4],['浴室の掃除','routine','check',4]].map(([name,category,type,c])=>({id:uid(),name,category,type,color:colors[c],interval:7,states:['悪い','普通','良い'],stateIcons:['😞','😐','😊'],stateColors:['#E5B6B6','#EBD5A6','#A8D6B5'],unit:'',order:c,archived:false}));let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.items)||typeof data.records!=='object'||!data.records)data={items:seed,records:{}};if(!Array.isArray(data.groups))data.groups=[{id:'health',name:'体調管理',order:0},{id:'maintenance',name:'メンテナンス',order:1},{id:'exercise',name:'運動',order:2}];
const defaultGroupByName={'体調':'health','タンパク質':'health','朝の歯磨き':'maintenance','自室の掃除':'maintenance','浴室の掃除':'maintenance','ストレッチ':'exercise'};
for(const i of data.items){if(i.groupId===undefined)i.groupId=defaultGroupByName[i.name]||''}
function sortedGroups(){return [...data.groups].sort((a,b)=>(a.order??0)-(b.order??0))}
function groupBlocks(items){const groups=sortedGroups(),out=groups.map(g=>({id:g.id,name:g.name,items:items.filter(i=>i.groupId===g.id)})).filter(g=>g.items.length);const rest=items.filter(i=>!groups.some(g=>g.id===i.groupId));if(rest.length)out.push({id:'',name:'未分類',items:rest});return out}
function groupOptions(id){return '<option value="">未分類</option>'+sortedGroups().map(g=>`<option value="${esc(g.id)}" ${g.id===id?'selected':''}>${esc(g.name)}</option>`).join('')}
let tab='today',month=new Date(),selectedDate=today(),editing=null,calendarPosition=null;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('保存できませんでした。ストレージの空き容量をご確認ください。')}}function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}function val(id,date=selectedDate){return data.records[date]?.[id]}function setVal(id,value,date=selectedDate){if(!data.records[date])data.records[date]={};if(value===null||value===''){delete data.records[date][id];if(!Object.keys(data.records[date]).length)delete data.records[date]}else data.records[date][id]=value;save();render()}function activeItems(cat){return data.items.filter(i=>!i.archived&&(!cat||i.category===cat)).sort((a,b)=>(a.order??0)-(b.order??0))}function lastDone(item){const dates=Object.keys(data.records).filter(d=>d<=today()&&data.records[d][item.id]!==undefined&&data.records[d][item.id]!==false&&data.records[d][item.id]!==0).sort();return dates.at(-1)}function daysAgo(s){if(!s)return null;return Math.round((new Date(today()+'T12:00:00')-new Date(s+'T12:00:00'))/86400000)}function stateColor(item,n){const c=item.stateColors?.[n];return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:item.color}function inputFor(item,date=selectedDate){const v=val(item.id,date);if(item.type==='check')return `<button class="btn bigcheck ${v===true?'primary':''}" data-action="check" data-id="${item.id}" data-date="${date}" aria-label="${esc(item.name)}を記録">${v===true?'✓':'○'}</button>`;if(item.type==='state')return `<div class="statechoice">${(item.states||[]).map((s,n)=>`<button data-action="state" data-id="${item.id}" data-date="${date}" data-value="${n}" class="${v===n?'active':''}" style="${v===n?`background:${stateColor(item,n)}`:''}">${esc((item.stateIcons||[])[n]||'')}<span class="state-text">${esc(s)}</span></button>`).join('')}</div>`;if(item.type==='number')return `<div class="control"><input class="number" inputmode="decimal" type="number" step="any" data-action="number" data-id="${item.id}" data-date="${date}" value="${v??''}" placeholder="—"><span class="muted">${esc(item.unit||'')}</span></div>`;return `<div class="control"><button class="btn" data-action="minus" data-id="${item.id}" data-date="${date}">−</button><b>${v??'—'}</b><button class="btn" data-action="plus" data-id="${item.id}" data-date="${date}">＋</button></div>`}function itemCard(i){let last=lastDone(i),ago=daysAgo(last);return `<div class="card item"><span class="stripe" style="background:${i.color}"></span><div class="grow"><div class="name">${esc(i.name)}</div>${i.category==='routine'?`<div class="muted">${last?`最終実施 ${last} · ${ago}日前`:'実施記録なし'} · 目標 ${i.interval||7}日間隔</div>`:`<div class="muted">${{check:'チェック',state:'状態',number:'数値',count:'回数'}[i.type]}</div>`}</div>${inputFor(i)}</div>`}function renderToday(){const blocks=groupBlocks(activeItems());return `<div class="toolbar today-toolbar"><div class="date-nav"><button type="button" class="nav-day" data-action="datePrev" aria-label="前日へ">‹ 前日</button><span class="date-current">${selectedDate.replaceAll('-','/')}</span><button type="button" class="nav-day" data-action="dateNext" aria-label="翌日へ">翌日 ›</button></div><div class="back-slot">${selectedDate!==today()?'<button type="button" class="back-today" data-action="dateToday">今日に戻る</button>':''}</div></div><div class="hint today-hint">記録は自動保存されます。頻度管理の項目には最終実施日と経過日数を表示します。</div>${blocks.map(g=>`<section class="group-section"><h2 class="group-title">${esc(g.name)}</h2>${g.items.map(itemCard).join('')}</section>`).join('')||'<div class="empty">項目がありません</div>'}`}
function renderMonth(){const list=activeItems(),anchor=new Date(month.getFullYear(),month.getMonth(),1),months=Array.from({length:7},(_,k)=>new Date(anchor.getFullYear(),anchor.getMonth()+k-3,1)),dates=[];for(const m of months){const y=m.getFullYear(),mm=m.getMonth(),total=new Date(y,mm+1,0).getDate();for(let d=1;d<=total;d++)dates.push({date:`${y}-${String(mm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,day:d,week:new Date(y,mm,d).getDay(),monthStart:d===1,monthKey:`${y}-${String(mm+1).padStart(2,'0')}`})}let h=`<div class="toolbar"><button data-action="prev">‹ さらに過去</button><b>カレンダー</b><button data-action="next">さらに未来 ›</button></div><p class="muted">左右にスクロールして月をまたいで確認できます。マスを押すと、その日の入力画面に移動します。</p><div class="scroll" id="calendarScroll"><div class="matrix" style="grid-template-columns:108px repeat(${dates.length},20px)"><div class="rowlabel monthlabel calendar-sticky-month">年月</div>`;for(const d of dates)h+=`<div class="monthhead calendar-sticky-month" ${d.monthStart?`data-month="${d.monthKey}"`:''}>${d.monthStart?`${Number(d.monthKey.slice(5))}月`:''}</div>`;h+='<div class="rowlabel calendar-sticky-day">項目 / 日付</div>';for(const d of dates)h+=`<div class="cell dayhead calendar-sticky-day ${d.week===0?'sun':d.week===6?'sat':''} ${d.date===today()?'today':''}" style="border:0">${d.day}</div>`;for(const g of groupBlocks(list)){h+=`<div class="rowlabel group-row" title="${esc(g.name)}">${esc(g.name)}</div>`;for(const d of dates)h+=`<div class="group-row-fill"></div>`;for(const i of g.items){h+=`<div class="rowlabel" style="border-left:4px solid ${i.color};padding-left:5px" title="${esc(i.name)}">${esc(i.name)}</div>`;for(const d of dates){const v=val(i.id,d.date),present=v!==undefined,label=present?(i.type==='check'?'':i.type==='state'?(i.stateIcons||[])[v]||(i.states||[])[v]?.slice(0,1)||'':String(v)):'';h+=`<button class="cell ${present?'filled':''} ${d.date===today()?'today':''}" data-action="day" data-date="${d.date}" title="${esc(i.name)} ${d.date}: ${esc(present?(i.type==='check'?(v===true?'実施済み':'未実施'):i.type==='state'?((i.states||[])[v]??'状態不明'):String(v)):'未入力')}" style="${present?`background:${i.type==='state'?stateColor(i,v):i.color};`:''}${!present&&d.week===0?'background:#fff3f3;':!present&&d.week===6?'background:#eff6fc;':''}">${esc(label)}</button>`}}}return h+'</div></div><p class="muted">表示範囲の端に近づいたら「さらに過去／未来」で範囲を広げられます。</p>'}
function positionCalendar(){const sc=document.getElementById('calendarScroll');if(!sc)return;const key=calendarPosition||`${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`;const target=sc.querySelector(`[data-month="${key}"]`);if(target)sc.scrollLeft=Math.max(0,target.offsetLeft-150);calendarPosition=null}
function renderItems(){const blocks=groupBlocks(activeItems());return `<div class="card group-manager"><div class="toolbar"><h2>カテゴリグループ</h2><button class="btn" data-action="newGroup">＋ グループを追加</button></div><p class="muted">体調管理・メンテナンスなど、自由にグループを作成できます。習慣管理／頻度管理とは独立しています。</p>${sortedGroups().map((g,n,a)=>`<div class="group-manage-row"><span class="grow name">${esc(g.name)}</span><button class="btn" data-action="groupUp" data-id="${esc(g.id)}" ${n===0?'disabled':''} aria-label="上へ">↑</button><button class="btn" data-action="groupDown" data-id="${esc(g.id)}" ${n===a.length-1?'disabled':''} aria-label="下へ">↓</button><button class="btn" data-action="renameGroup" data-id="${esc(g.id)}">編集</button><button class="btn" data-action="deleteGroup" data-id="${esc(g.id)}">削除</button></div>`).join('')}</div><div class="toolbar item-manager-toolbar"><h2>記録項目</h2><button data-action="new">＋ 項目を追加</button></div>${blocks.map(g=>`<section class="group-section"><h2 class="group-title">${esc(g.name)}</h2>${g.items.map((i,n,a)=>`<div class="card item"><span class="stripe" style="background:${i.color}"></span><div class="grow"><div class="name">${esc(i.name)}</div><div class="muted">${i.category==='habit'?'習慣':'頻度'} · ${{check:'チェック',state:'状態',number:'数値',count:'回数'}[i.type]}</div></div><button class="btn" data-action="up" data-id="${i.id}" ${n===0?'disabled':''}>↑</button><button class="btn" data-action="down" data-id="${i.id}" ${n===a.length-1?'disabled':''}>↓</button><button class="btn" data-action="edit" data-id="${i.id}">編集</button></div>`).join('')}</section>`).join('')}<div id="editArea"></div>`}
function editor(){let i=editing||{name:'',category:'habit',type:'check',color:colors[0],interval:7,states:['悪い','普通','良い'],stateIcons:['😞','😐','😊'],stateColors:['#E5B6B6','#EBD5A6','#A8D6B5'],unit:''};return `<div class="card editor" id="editor"><h2>${editing?.id?'項目を編集':'新しい項目'}</h2><label>項目名<input id="eName" maxlength="60" value="${esc(i.name)}" required></label><label>カテゴリグループ<select id="eGroup">${groupOptions(i.groupId||'')}</select></label><label>管理方式<select id="eCategory"><option value="habit" ${i.category==='habit'?'selected':''}>習慣管理</option><option value="routine" ${i.category==='routine'?'selected':''}>頻度管理</option></select></label><label>記録方式<select id="eType">${[['check','チェック'],['state','状態選択'],['number','数値'],['count','回数']].map(([v,t])=>`<option value="${v}" ${i.type===v?'selected':''}>${t}</option>`).join('')}</select></label><div id="baseColorField"><label>表示色（自由指定）<div class="control"><input id="eColor" type="color" value="${i.color}" style="width:64px;height:44px;padding:4px;cursor:pointer"><input id="eHex" maxlength="7" value="${i.color}" aria-label="カラーコード" placeholder="#RRGGBB"></div></label><div class="actions">${colors.map(c=>`<button type="button" data-action="presetColor" data-color="${c}" aria-label="色 ${c}" title="${c}" style="background:${c};width:30px;height:30px;border:1px solid #ddd;border-radius:9px"></button>`).join('')}</div></div><div id="intervalField"><label>頻度管理の目標間隔（日）<input id="eInterval" type="number" min="1" max="3650" value="${i.interval||7}"></label></div><div id="stateEditor" class="state-editor"><div class="state-editor-head"><strong>状態の設定</strong><span class="muted">アイコン・名前・色</span></div><div class="state-editor-legend"><span>アイコン</span><span>状態名</span><span>表示色</span><span></span></div><div id="stateRows"></div><button type="button" class="btn state-add" data-action="addState">＋ 状態を追加</button><div class="state-help">状態は2つ以上設定してください。行の削除後も、既存の記録は可能な範囲で対応する状態へ引き継ぎます。</div></div><div id="unitField"><label>数値の単位（任意）<input id="eUnit" maxlength="20" value="${esc(i.unit||'')}"></label></div><div class="hint">記録方式を変更しても過去の値は削除しません。ただし古い記録は新しい方式で正しく解釈できない場合があります。変更前にバックアップをおすすめします。</div><div class="actions"><button class="btn primary" data-action="saveItem">保存</button><button class="btn" data-action="cancel">キャンセル</button>${editing?.id?'<button class="btn" data-action="archive">項目を非表示</button><button class="btn" data-action="delete">完全削除</button>':''}</div></div>`}
function renderSettings(){return `<h2>データ管理</h2><div class="card"><p class="name">JSONバックアップ</p><p class="muted">項目設定とすべての日付の記録を保存します。別の端末への移行にも使用できます。</p><div class="actions"><button class="btn primary" data-action="export">JSONを書き出す</button><label class="btn" style="cursor:pointer">JSONから復元<input id="import" type="file" accept=".json,application/json" hidden></label></div></div><div class="card"><p class="name">保存について</p><p class="muted">記録はこのブラウザのローカルストレージに保存されます。ブラウザのデータ削除、端末変更、ストレージ整理などで失われる可能性があります。定期的にバックアップしてください。複数端末間の同期はありません。</p></div><div class="card"><p class="name">非表示の項目</p>${data.items.filter(i=>i.archived).map(i=>`<div class="item" style="padding:7px 0"><span>${esc(i.name)}</span><button class="btn" data-action="restore" data-id="${i.id}">復元</button></div>`).join('')||'<p class="muted">ありません</p>'}</div><footer>カレンダー v1.7 · Personal PWA</footer>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));app.innerHTML=tab==='today'?renderToday():tab==='month'?renderMonth():tab==='items'?renderItems():renderSettings();if(tab==='items'&&editing){document.getElementById('editArea').innerHTML=editor();renderStateRows(editing);updateEditorFields()}if(tab==='month')requestAnimationFrame(positionCalendar)}
function move(id,dir){const i=data.items.find(x=>x.id===id);if(!i)return;const a=activeItems().filter(x=>(x.groupId||'')===(i.groupId||'')),n=a.findIndex(x=>x.id===id),other=a[n+dir];if(!other)return;const ix=data.items.indexOf(i),iy=data.items.indexOf(other);[data.items[ix].order,data.items[iy].order]=[data.items[iy].order,data.items[ix].order];save();render()}
function moveGroup(id,dir){const a=sortedGroups(),n=a.findIndex(g=>g.id===id),other=a[n+dir];if(!other)return;[a[n].order,other.order]=[other.order,a[n].order];save();render()}
function stateRowHtml(state){const icon=state.icon||'',name=state.name||'',color=/^#[0-9a-fA-F]{6}$/.test(state.color||'')?state.color:document.getElementById('eColor').value;return `<div class="state-row" data-original-index="${state.original}"><input class="state-icon" aria-label="状態アイコン" maxlength="12" value="${esc(icon)}" placeholder="○"><input class="state-name" aria-label="状態名" maxlength="40" value="${esc(name)}" placeholder="状態名"><input class="state-swatch" type="color" aria-label="状態の表示色" value="${color}"><button type="button" class="state-remove" data-action="removeState" aria-label="状態を削除">×</button></div>`}
function updateEditorFields(){const type=document.getElementById('eType')?.value,category=document.getElementById('eCategory')?.value;if(!type)return;for(const [id,visible] of [['baseColorField',type!=='state'],['intervalField',category==='routine'],['stateEditor',type==='state'],['unitField',type==='number']]){const el=document.getElementById(id);if(el)el.hidden=!visible}}
function renderStateRows(item){const box=document.getElementById('stateRows');if(!box)return;const states=item.states?.length?item.states:['悪い','普通','良い'];box.innerHTML=states.map((name,n)=>stateRowHtml({name,icon:item.stateIcons?.[n]||'',color:item.stateColors?.[n]||item.color,original:item.id?n:-1})).join('')}
function getStateRows(){return [...document.querySelectorAll('#stateRows .state-row')].map(row=>({name:row.querySelector('.state-name').value.trim(),icon:row.querySelector('.state-icon').value.trim(),color:row.querySelector('.state-swatch').value,original:Number(row.dataset.originalIndex)}))}
function saveItem(){let name=document.getElementById('eName').value.trim(),type=document.getElementById('eType').value,rows=getStateRows(),states=rows.map(r=>r.name);if(!name)return alert('項目名を入力してください');if(type==='state'&&(states.length<2||states.some(s=>!s)))return alert('状態選択は2つ以上の選択肢を設定してください');let obj={...(editing||{}),id:editing?.id||uid(),name,groupId:document.getElementById('eGroup').value,category:document.getElementById('eCategory').value,type,color:document.getElementById('eColor').value,interval:Math.max(1,Number(document.getElementById('eInterval').value)||7),states,stateIcons:rows.map(r=>r.icon),stateColors:rows.map(r=>r.color),unit:document.getElementById('eUnit').value.trim(),archived:false,order:editing?.order??data.items.length};if(editing?.id&&type==='state'&&editing.type==='state'){
  const remap=new Map(rows.filter(r=>r.original>=0).map((r,n)=>[r.original,n]));
  for(const record of Object.values(data.records)){const v=record[editing.id];if(typeof v==='number'&&Number.isInteger(v)){if(remap.has(v))record[editing.id]=remap.get(v);else delete record[editing.id]}}
}if(editing?.id){data.items[data.items.findIndex(i=>i.id===editing.id)]=obj}else data.items.push(obj);editing=null;save();render();toast('保存しました')}
function validImport(x){return x&&Array.isArray(x.items)&&x.records&&typeof x.records==='object'&&!Array.isArray(x.records)&&x.items.every(i=>typeof i.id==='string'&&typeof i.name==='string'&&['habit','routine'].includes(i.category)&&['check','state','number','count'].includes(i.type)&&/^#[0-9a-fA-F]{6}$/.test(i.color))&&Object.entries(x.records).every(([d,r])=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&r&&typeof r==='object'&&!Array.isArray(r))}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;editing=null;render();return}let a=b.dataset.action,id=b.dataset.id,date=b.dataset.date||selectedDate,i=data.items.find(x=>x.id===id),v=i&&val(id,date);switch(a){case'datePrev':selectedDate=shiftDate(selectedDate,-1);render();break;case'dateNext':selectedDate=shiftDate(selectedDate,1);render();break;case'dateToday':selectedDate=today();render();break;case'check':setVal(id,v===true?null:true,date);break;case'state':setVal(id,v===Number(b.dataset.value)?null:Number(b.dataset.value),date);break;case'plus':setVal(id,(Number(v)||0)+1,date);break;case'minus':setVal(id,Math.max(0,(Number(v)||0)-1),date);break;case'day':selectedDate=date;tab='today';render();break;case'prev':month=new Date(month.getFullYear(),month.getMonth()-3,1);render();break;case'next':month=new Date(month.getFullYear(),month.getMonth()+3,1);render();break;case'addState':{const box=document.getElementById('stateRows');box.insertAdjacentHTML('beforeend',stateRowHtml({name:'',icon:'',color:document.getElementById('eColor').value,original:-1}));box.lastElementChild.querySelector('.state-name').focus();break}case'removeState':{const row=b.closest('.state-row');if(row){if(document.querySelectorAll('#stateRows .state-row').length<=2){alert('状態は2つ以上必要です');break}row.remove()}break}case'presetColor':{const c=b.dataset.color;document.getElementById('eColor').value=c;document.getElementById('eHex').value=c;break}case'newGroup':{const name=prompt('新しいグループ名');if(name?.trim()){data.groups.push({id:uid(),name:name.trim().slice(0,60),order:data.groups.length});save();render()}break}case'renameGroup':{const g=data.groups.find(x=>x.id===id);if(!g)break;const name=prompt('グループ名',g.name);if(name?.trim()){g.name=name.trim().slice(0,60);save();render()}break}case'deleteGroup':{const g=data.groups.find(x=>x.id===id);if(g&&confirm(`「${g.name}」を削除しますか？所属する項目は削除せず「未分類」に移動します。`)){data.items.filter(x=>x.groupId===id).forEach(x=>x.groupId='');data.groups=data.groups.filter(x=>x.id!==id);save();render()}break}case'groupUp':moveGroup(id,-1);break;case'groupDown':moveGroup(id,1);break;case'new':editing={};render();document.getElementById('editArea').scrollIntoView({behavior:'smooth'});break;case'edit':editing={...i};render();document.getElementById('editArea').scrollIntoView({behavior:'smooth'});break;case'cancel':editing=null;render();break;case'saveItem':saveItem();break;case'up':move(id,-1);break;case'down':move(id,1);break;case'archive':if(confirm('項目を非表示にしますか？過去の記録は保持されます。')){data.items.find(x=>x.id===editing.id).archived=true;editing=null;save();render()}break;case'delete':if(confirm('この項目と過去の全記録を完全削除します。元に戻せません。続けますか？')){let del=editing.id;data.items=data.items.filter(x=>x.id!==del);Object.values(data.records).forEach(r=>delete r[del]);editing=null;save();render()}break;case'restore':i.archived=false;save();render();break;case'export':{let blob=new Blob([JSON.stringify({...data,version:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`habit-log-${today()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}}});document.addEventListener('input',e=>{if(e.target.id==='eColor')document.getElementById('eHex').value=e.target.value;if(e.target.id==='eHex'&&/^#[0-9a-fA-F]{6}$/.test(e.target.value))document.getElementById('eColor').value=e.target.value});document.addEventListener('change',async e=>{if(e.target.id==='eType'||e.target.id==='eCategory')updateEditorFields();if(e.target.dataset.action==='number'){let v=e.target.value;setVal(e.target.dataset.id,v===''?null:Number(v),e.target.dataset.date)}if(e.target.id==='import'){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!validImport(x))throw Error('データ形式が正しくありません');if(confirm('現在のすべての記録をバックアップ内容で置き換えます。よろしいですか？')){data={items:x.items,records:x.records,groups:Array.isArray(x.groups)?x.groups:[]};save();render();toast('復元しました')}}catch(err){alert('読み込み失敗: '+err.message)}}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
